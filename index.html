<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مواعيد مستر محمد مجدي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap">
<style>
:root{--bg:#efe2c4;--card:#f9f1df;--ink:#2a1a12;--maroon:#8c1236;--brown:#5e2d08;--gold:#b8731f;--on-dark:#fbf1dc;--muted:#6b5443;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1410;--card:#2c1d17;--ink:#f3e6cc;--maroon:#c2305a;--brown:#e3c68e;--gold:#e3c68e;--muted:#c9b393;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1410;--card:#2c1d17;--ink:#f3e6cc;--maroon:#c2305a;--brown:#e3c68e;--gold:#e3c68e;--muted:#c9b393;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,'Segoe UI',sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
header{background:#8c1236;color:#fbf1dc;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-size:22px;font-weight:900}
header a{font-weight:700;border:2px solid #e3c68e;padding:6px 16px;border-radius:999px;min-height:44px;display:inline-flex;align-items:center}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
header button.design{font:inherit;font-weight:700;border:2px solid #e3c68e;padding:6px 16px;border-radius:999px;min-height:44px;background:#e3c68e;color:#2a1a12;cursor:pointer}
dialog{border:none;border-radius:22px;padding:28px 32px;background:var(--card);color:var(--ink);text-align:center;font-family:inherit;max-width:320px;width:calc(100% - 40px)}
dialog::backdrop{background:rgba(30,20,16,.65)}
dialog p{margin:0 0 4px;color:var(--muted);font-size:17px}
dialog h2{margin:0 0 18px;font-size:30px;font-weight:900;color:var(--maroon);direction:ltr}
.wa-logo{display:inline-block;width:72px;height:72px;border-radius:50%}
.wa-logo svg{width:100%;height:100%;display:block}
.close{display:block;margin:18px auto 0;font:inherit;font-weight:700;background:none;border:none;color:var(--muted);cursor:pointer;min-height:44px;padding:0 16px}
@media (max-width:420px){header a,header button.design{padding:6px 12px;font-size:15px}}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.hero{padding:40px 0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.hero img{width:300px;max-width:42%;height:auto;border-radius:24px;flex:none}@media (max-width:640px){.hero{flex-direction:column;align-items:stretch}.hero img{max-width:280px;align-self:center}}
.grade{display:inline-block;margin:0 0 14px;padding:6px 22px;border-radius:999px;background:var(--maroon);color:#fbf1dc;font-size:clamp(20px,4vw,30px);font-weight:900}
h1{margin:0 0 10px;font-size:clamp(34px,7vw,60px);line-height:1.2;font-weight:900;color:var(--brown)}
.hero p{margin:0;font-size:clamp(17px,3vw,22px);color:var(--muted);max-width:560px}
.list{display:flex;flex-direction:column;gap:14px;padding:16px 0 40px}
.card{background:var(--card);border-radius:18px;border-right:8px solid var(--maroon);padding:18px 22px;display:grid;grid-template-columns:130px 1fr auto;gap:8px 20px;align-items:center}
.day{font-size:26px;font-weight:900;color:var(--maroon)}
.time{font-size:20px;font-weight:700;direction:ltr;text-align:right}
.info{font-size:22px;font-weight:700}
.info small:empty{display:none}.info small{display:block;color:var(--muted);font-size:15px}
.btn{background:var(--brown);color:var(--bg);font-weight:700;padding:12px 22px;border-radius:12px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.btn.wa{background:#8c1236;color:#fbf1dc;font-size:20px;padding:14px 30px;margin-top:20px}
footer{background:#5e2d08;color:#fbf1dc;padding:28px 20px;text-align:center;font-size:17px}
footer a{font-weight:700;text-decoration:underline}
@media (max-width:640px){.card{grid-template-columns:1fr}.btn{width:100%}header b{font-size:19px}}
</style>
</head>
